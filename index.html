<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shirley’s AI Speaking Coach</title>

  <!-- Whisper (optional refine) -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.min.js"></script>

  <style>
    :root{
      --bg-0:#05060a; --bg-1:#0b1020; --bg-2:#0a0f1a;
      --ink-0:#e6ecf7; --ink-1:#a9b3c7; --ink-2:#7d879b;
      --neon-cyan:#5ce1e6; --neon-violet:#8b7cff; --neon-rose:#ff8c7a; --neon-green:#3ddc97;
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --shadow-soft: 0 20px 60px rgba(0,0,0,.55);
      --radius:18px;

      --fs-base:17px;
      --fs-small:15px;
      --fs-title:26px;
      --fs-sentence:22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", sans-serif;
      color:var(--ink-0);
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(92,225,230,.18), transparent 60%),
        radial-gradient(900px 600px at 110% 0%, rgba(139,124,255,.16), transparent 55%),
        radial-gradient(700px 500px at 50% 120%, rgba(255,140,122,.10), transparent 65%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
      min-height:100vh; padding:16px;
      font-size:var(--fs-base);
    }

    .wrap{
      max-width:1100px; margin:0 auto;
      background: linear-gradient(180deg, rgba(10,14,25,.9), rgba(8,10,18,.9));
      border:1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      border-radius:var(--radius);
      position:relative; overflow:hidden;
    }
    .wrap::before{
      content:""; position:absolute; left:0; right:0; top:0; height:2px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet), var(--neon-rose));
      opacity:.9;
    }

    header{
      padding:18px 20px 12px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.06);
      position:relative; z-index:1;
    }
    h1{
      margin:0; font-size:var(--fs-title); font-weight:800; letter-spacing:.5px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow: 0 0 30px rgba(92,225,230,.12);
      user-select:none;
    }

    main{
      display:grid; grid-template-columns: 1.1fr .9fr; gap:14px;
      padding:14px; position:relative; z-index:1;
    }
    @media (max-width: 980px){ main{ grid-template-columns:1fr; } }

    .card{
      background: var(--glass);
      border:1px solid var(--glass-border);
      box-shadow: 0 8px 25px rgba(0,0,0,.35);
      border-radius:14px; padding:14px;
    }
    .card-title{
      font-size:18px; font-weight:800; letter-spacing:.3px; margin-bottom:10px;
      display:flex; align-items:center; gap:8px;
    }
    .dot{
      width:9px; height:9px; border-radius:999px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet));
      box-shadow:0 0 12px rgba(92,225,230,.6);
    }

    textarea, select, input{
      width:100%;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.12);
      color:var(--ink-0);
      border-radius:10px; padding:11px 12px; outline:none;
      font-size:var(--fs-base); line-height:1.6;
    }

    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

    .btn{
      border:0; cursor:pointer; padding:12px 14px; border-radius:12px;
      color:#041018; font-weight:800; letter-spacing:.2px;
      background: linear-gradient(135deg, rgba(92,225,230,.9), rgba(139,124,255,.9));
      box-shadow: 0 10px 30px rgba(92,225,230,.18);
      transition: transform .15s ease, filter .2s ease, opacity .2s ease;
      font-size:var(--fs-base);
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); filter:saturate(1.1); }
    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
    .btn-ghost{
      background: rgba(255,255,255,0.06);
      color:var(--ink-0);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:none;
    }
    .btn-accent{ background: linear-gradient(135deg, var(--neon-rose), #ffb29b); }
    .btn-success{ background: linear-gradient(135deg, #3ddc97, #25b47e); color:#04120a; }
    .btn-danger{ background: linear-gradient(135deg, #ff6b6b, #c44569); color:#100407; }

    .pill{
      display:inline-flex; align-items:center; gap:6px;
      font-size:var(--fs-small); color:var(--ink-1);
      padding:6px 10px; border-radius:999px;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.10);
      white-space:nowrap;
    }

    .sentence-box{
      padding:14px; border-radius:12px;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      min-height:96px;
    }
    .sentence{ font-size:var(--fs-sentence); font-weight:800; line-height:1.6; }

    .mic{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .meter{
      height:12px; border-radius:999px; background:rgba(255,255,255,0.08);
      overflow:hidden; position:relative; flex:1 1 160px;
      border:1px solid rgba(255,255,255,0.12);
    }
    .meter > span{
      position:absolute; inset:0; width:0%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      box-shadow:0 0 18px rgba(61,220,151,.8);
      transition:width .07s linear;
    }

    .status{ font-size:var(--fs-small); color:var(--ink-1); min-height:20px; }
    .status.ok{ color:#aef1d2; }
    .status.warn{ color:#ffe3a1; }
    .status.err{ color:#ffb3b3; }

    .result{
      padding:12px; border-radius:12px;
      background: rgba(255,255,255,0.04);
      border:1px dashed rgba(255,255,255,0.14);
      display:grid; gap:8px;
    }
    .diff{
      font-size:var(--fs-base); line-height:1.7; word-break:break-word;
      padding:10px 12px; border-radius:10px;
      background: rgba(0,0,0,0.25);
      border:1px solid rgba(255,255,255,0.08);
    }
    .diff .ok{ color:var(--ink-0); }
    .diff .sub{ color:#ffd0a4; text-decoration: underline wavy rgba(255,208,164,.7); }
    .diff .del{ color:#ffadad; text-decoration: line-through rgba(255,173,173,.7); }
    .diff .ins{ color:#b7c7ff; border-bottom:1px dotted rgba(183,199,255,.6); }

    /* Preview list */
    .plist{ display:grid; gap:8px; max-height:420px; overflow:auto; padding-right:2px;}
    .pitem{
      padding:10px 12px; border-radius:10px;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      display:grid; gap:6px; cursor:pointer;
    }
    .pitem.active{ border-color: var(--neon-cyan); box-shadow:0 0 0 2px rgba(92,225,230,.12); }
    .pitem .small{ font-size:var(--fs-small); color:var(--ink-1); }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.6);
      display:none; place-items:center; padding:16px; z-index:999;
    }
    .modal{
      width:min(900px, 100%);
      background: #0b0f19;
      border:1px solid var(--glass-border);
      border-radius:14px; padding:14px;
      box-shadow: var(--shadow-soft);
    }
    .modal h2{ margin:0 0 8px; font-size:20px; }
    .table{
      width:100%; border-collapse:separate; border-spacing:0 8px;
      font-size:15px;
    }
    .table td, .table th{
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      padding:8px 10px; vertical-align:top;
    }
    .table th{ text-align:left; font-weight:800; }

    @media print{
      body{ background:#fff; color:#000; }
      .wrap, header, main{ box-shadow:none; border:0; background:#fff; }
      .btn, .meter, .status, .mic, .card-title .dot, #rightPanelControls { display:none !important; }
      .card{ border:0; }
      .modal-backdrop{ position:static; display:block; background:none; padding:0; }
      .modal{ border:0; box-shadow:none; }
      .table td, .table th{ background:#fff; border:1px solid #ddd; }
    }
  </style>
</head>

<body>
<div class="wrap" id="app">
  <header>
    <h1>Shirley’s AI Speaking Coach</h1>
  </header>

  <main>
    <!-- Left: Practice -->
    <section class="card">
      <div class="card-title"><span class="dot"></span>Practice (Match Sentences)</div>

      <div class="sentence-box">
        <div class="sentence" id="sentenceText">請先載入句子再開始。</div>
      </div>

      <div class="row">
        <button class="btn btn-ghost" data-action="prev">◀ Prev</button>
        <span class="pill" id="progressPill">0 / 0</span>
        <button class="btn btn-ghost" data-action="next">Next ▶</button>
      </div>

      <div style="height:6px"></div>

      <div class="row">
        <button class="btn" data-action="listenTarget">🔊 Listen Target</button>
        <button class="btn btn-success" id="recordBtn" data-action="record" disabled>🎙️ Record</button>
        <button class="btn btn-danger" id="stopBtn" data-action="stop" disabled>■ Stop</button>
        <button class="btn btn-ghost" id="playMineBtn" data-action="playMine" disabled>▶ Play My Voice</button>
      </div>

      <div class="mic">
        <div class="meter"><span id="meterBar"></span></div>
        <span class="pill" id="timerPill">00:00</span>
      </div>

      <div class="status" id="statusLine"></div>

      <div class="result" id="resultPanel" hidden>
        <div class="pill">Your Speech (ASR):</div>
        <div id="hypLine"></div>
        <div class="pill">Accuracy:</div>
        <div id="accLine" style="font-size:20px;font-weight:900;"></div>
        <div class="pill">Diff:</div>
        <div class="diff" id="diffLine"></div>
      </div>

      <div id="sessionDone" hidden style="margin-top:10px;">
        <div class="pill" style="font-size:18px;color:#fff;">
          ✅ 本組 10 題完成！請到右側檢視每題狀況，或輸出報表。
        </div>
      </div>
    </section>

    <!-- Right: Source + Preview -->
    <section class="card">
      <div class="card-title"><span class="dot"></span>Sentence Source</div>

      <div class="row">
        <button class="btn" id="srcManualBtn" data-src="manual">Enter Manually</button>
        <button class="btn btn-ghost" id="srcBankBtn" data-src="bank">From Sentence Bank</button>
      </div>

      <div style="height:10px"></div>

      <div id="manualPane">
        <label style="font-size:var(--fs-small);color:var(--ink-1)">
          Sentences (one per line, max 10)
        </label>
        <textarea id="manualInput" rows="7" placeholder="e.g. I like apples."></textarea>
        <div style="height:8px"></div>
        <div class="row">
          <button class="btn btn-ghost" data-action="applyManual">Use These 10</button>
          <span class="pill" id="manualCount">0 / 10</span>
        </div>
      </div>

      <div id="bankPane" hidden>
        <label style="font-size:var(--fs-small);color:var(--ink-1)">Choose Level</label>
        <select id="levelSelect">
          <option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option>
          <option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option>
        </select>

        <div style="height:10px"></div>
        <label style="font-size:var(--fs-small);color:var(--ink-1)">Choose Unit</label>
        <select id="unitSelect" disabled></select>

        <div style="height:10px"></div>
        <div class="row">
          <button class="btn btn-ghost" data-action="load10">Load 10 Random</button>
          <button class="btn btn-ghost" data-action="applyBankUnit">Use Whole Unit</button>
          <span class="pill" id="bankCount">0 sentences</span>
        </div>
      </div>

      <div style="height:14px"></div>

      <div class="card-title"><span class="dot"></span>Preview (This Session)</div>
      <div id="rightPanelControls" class="row" style="margin-bottom:6px;">
        <span class="pill" id="sessionPill">0 / 10 completed</span>
        <button class="btn btn-ghost" data-action="export">Export Report</button>
      </div>

      <div id="previewList" class="plist">
        <div class="pill">尚未載入題目。</div>
      </div>
    </section>
  </main>
</div>

<!-- Export Modal -->
<div class="modal-backdrop" id="exportBackdrop">
  <div class="modal">
    <h2>Export / Print Report</h2>
    <div class="row">
      <input id="classInput" placeholder="班級 (e.g. 702)" />
      <input id="seatInput" placeholder="座號 (e.g. 15)" />
      <input id="nameInput" placeholder="姓名 (e.g. 王小明)" />
    </div>

    <div style="height:10px"></div>

    <table class="table" id="exportTable">
      <thead>
        <tr>
          <th style="width:44px">#</th>
          <th>Target</th>
          <th>Your ASR</th>
          <th style="width:90px">Accuracy</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="row" style="justify-content:flex-end;margin-top:8px;">
      <button class="btn btn-ghost" data-action="closeExport">Close</button>
      <button class="btn btn-ghost" data-action="downloadJson">Download JSON</button>
      <button class="btn btn-accent" data-action="print">Print</button>
    </div>
  </div>
</div>

<script>
/* ===========================
   Helpers / Store / UI
=========================== */
const $ = (s, r=document) => r.querySelector(s);
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
const escapeHtml = s => s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const store = {
  source:'manual',
  level:1,
  unit:'ALL',
  bankCache:new Map(),

  session:[],        // current working set (10 or a unit)
  idx:0,
  results:new Map(), // idx -> {hyp, acc, diffs}

  whisperReady:false,
  preferWhisper:true,

  lastRecordingBlob:null,
};

const ui = {
  sentenceText:$('#sentenceText'),
  progressPill:$('#progressPill'),
  sessionPill:$('#sessionPill'),
  recordBtn:$('#recordBtn'),
  stopBtn:$('#stopBtn'),
  playMineBtn:$('#playMineBtn'),
  meterBar:$('#meterBar'),
  timerPill:$('#timerPill'),
  statusLine:$('#statusLine'),
  resultPanel:$('#resultPanel'),
  hypLine:$('#hypLine'),
  accLine:$('#accLine'),
  diffLine:$('#diffLine'),
  sessionDone:$('#sessionDone'),

  srcManualBtn:$('#srcManualBtn'),
  srcBankBtn:$('#srcBankBtn'),
  manualPane:$('#manualPane'),
  bankPane:$('#bankPane'),
  manualInput:$('#manualInput'),
  manualCount:$('#manualCount'),
  levelSelect:$('#levelSelect'),
  unitSelect:$('#unitSelect'),
  bankCount:$('#bankCount'),
  previewList:$('#previewList'),

  exportBackdrop:$('#exportBackdrop'),
  exportTableBody:$('#exportTable tbody'),
  classInput:$('#classInput'),
  seatInput:$('#seatInput'),
  nameInput:$('#nameInput'),
};

/* ===========================
   Status helpers
=========================== */
function setStatus(msg, kind=''){
  ui.statusLine.className = 'status '+kind;
  ui.statusLine.textContent = msg||'';
}
function clearResult(){
  ui.resultPanel.hidden=true;
  ui.hypLine.textContent='';
  ui.accLine.textContent='';
  ui.diffLine.innerHTML='';
}

/* ===========================
   Parsing
=========================== */
function parseManual(text){
  return text.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,10)
    .map(line=>{
      line=line.replace(/^\s*[\(\[]?\d+[\)\]]?\s*[\.\:\、\)]\s*/,'');
      return { en: line };
    });
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const items=[];
  for(const line of lines){
    const i=line.indexOf(',');
    if(i===-1) continue;
    const number=line.slice(0,i).trim();
    const sentence=line.slice(i+1).trim();
    if(!sentence) continue;
    const dash=number.indexOf('-');
    const unit=dash===-1?'0':number.slice(0,dash).trim();
    items.push({ en: sentence, number, unit });
  }
  return items;
}

/* ===========================
   Render
=========================== */
function renderCurrent(){
  const item=store.session[store.idx];
  if(!item){
    ui.sentenceText.textContent='請先載入題目再開始。';
    ui.progressPill.textContent='0 / 0';
    ui.recordBtn.disabled=true;
    return;
  }
  ui.sentenceText.textContent=item.en;
  ui.progressPill.textContent=`${store.idx+1} / ${store.session.length}`;

  clearResult();
  const r=store.results.get(store.idx);
  if(r){
    ui.resultPanel.hidden=false;
    ui.hypLine.textContent=r.hyp;
    ui.accLine.textContent=r.acc+'%';
    ui.diffLine.innerHTML=formatDiff(r.diffs);
    ui.playMineBtn.disabled=!store.lastRecordingBlob;
  }

  // session done?
  if(store.session.length===10){
    const doneCount=[...store.results.keys()].length;
    ui.sessionPill.textContent=`${doneCount} / 10 completed`;
    ui.sessionDone.hidden = doneCount<10;
  }else{
    ui.sessionPill.textContent=`${[...store.results.keys()].length} completed`;
    ui.sessionDone.hidden=true;
  }

  renderPreview();
}

function renderPreview(){
  if(!store.session.length){
    ui.previewList.innerHTML=`<div class="pill">尚未載入題目。</div>`;
    return;
  }
  ui.previewList.innerHTML=store.session.map((it,i)=>{
    const r=store.results.get(i);
    const acc=r?`<span class="pill" style="font-weight:900">${r.acc}%</span>`:'';
    const hyp=r?`<div class="small">You: ${escapeHtml(r.hyp)}</div>`:'<div class="small">Not attempted</div>';
    return `
      <div class="pitem ${i===store.idx?'active':''}" data-jump="${i}">
        <div><b>${i+1}.</b> ${escapeHtml(it.en)}</div>
        ${hyp}
        ${acc}
      </div>
    `;
  }).join('');
}

/* click preview to jump */
ui.previewList.addEventListener('click',(e)=>{
  const it=e.target.closest('[data-jump]');
  if(!it) return;
  store.idx=Number(it.dataset.jump);
  renderCurrent();
});

/* ===========================
   Source toggle
=========================== */
function setSource(src){
  store.source=src;
  const isManual=src==='manual';
  ui.manualPane.hidden=!isManual;
  ui.bankPane.hidden=isManual;
  ui.srcManualBtn.className=isManual?'btn':'btn btn-ghost';
  ui.srcBankBtn.className=!isManual?'btn':'btn btn-ghost';
  setStatus(isManual?'Manual mode ready.':'Sentence bank ready.','ok');
  clearSession();
  if(!isManual) setLevel(store.level);
}

/* ===========================
   Session control
=========================== */
function clearSession(){
  store.session=[];
  store.idx=0;
  store.results.clear();
  store.lastRecordingBlob=null;
  ui.playMineBtn.disabled=true;
  renderCurrent();
}
function useSession(items){
  store.session=items;
  store.idx=0;
  store.results.clear();
  store.lastRecordingBlob=null;
  ui.playMineBtn.disabled=true;
  ui.recordBtn.disabled=false;
  renderCurrent();
}

/* Manual apply: exactly those 10 */
function applyManual(){
  const items=parseManual(ui.manualInput.value);
  useSession(items);
  setStatus(items.length?'Loaded manual session.':'No sentences found.','ok');
}
ui.manualInput.addEventListener('input',()=>{
  const c=ui.manualInput.value.split('\n').filter(x=>x.trim()).length;
  ui.manualCount.textContent=`${Math.min(c,10)} / 10`;
});

/* Bank load */
async function loadLevel(level){
  if(store.bankCache.has(level)) return store.bankCache.get(level);
  try{
    const resp=await fetch(`level${level}.csv`,{cache:'no-store'});
    const text=await resp.text();
    const items=parseCSV(text);
    const unitsMap=new Map();
    for(const it of items){
      if(!unitsMap.has(it.unit)) unitsMap.set(it.unit,[]);
      unitsMap.get(it.unit).push(it);
    }
    const pack={items,unitsMap};
    store.bankCache.set(level,pack);
    return pack;
  }catch(e){
    setStatus('Cannot load csv. Use a local server if file://','err');
    return {items:[],unitsMap:new Map()};
  }
}
async function setLevel(level){
  store.level=level;
  store.unit='ALL';
  const pack=await loadLevel(level);
  initUnits(pack.unitsMap);
  refreshBankCount();
}
function initUnits(unitsMap){
  const units=[...unitsMap.keys()].sort((a,b)=>Number(a)-Number(b));
  ui.unitSelect.disabled=units.length===0;
  ui.unitSelect.innerHTML=[
    `<option value="ALL">All Units (${units.length})</option>`,
    ...units.map(u=>`<option value="${u}">Unit ${u} (${unitsMap.get(u).length})</option>`)
  ].join('');
  ui.unitSelect.value='ALL';
}
function getFilteredBankItems(){
  const pack=store.bankCache.get(store.level);
  if(!pack) return [];
  if(store.unit==='ALL') return pack.items;
  return pack.unitsMap.get(store.unit)||[];
}
function refreshBankCount(){
  const items=getFilteredBankItems();
  ui.bankCount.textContent=`${items.length} sentences`;
}
ui.levelSelect.addEventListener('change',()=>setLevel(Number(ui.levelSelect.value)));
ui.unitSelect.addEventListener('change',()=>{
  store.unit=ui.unitSelect.value;
  refreshBankCount();
});

/* Load 10 random from selected unit */
function load10Random(){
  const items=getFilteredBankItems();
  if(!items.length){ setStatus('This unit is empty.','warn'); return; }
  const shuffled=items.slice().sort(()=>Math.random()-0.5);
  useSession(shuffled.slice(0,10));
  setStatus('Loaded 10 random sentences.','ok');
}
/* Use whole unit (not session stop at 10) */
function applyBankUnit(){
  const items=getFilteredBankItems();
  useSession(items);
  setStatus('Loaded this unit.','ok');
}

/* Nav */
function nav(step){
  if(!store.session.length) return;
  const next=store.idx+step;
  if(next<0 || next>=store.session.length) return;
  store.idx=next;
  renderCurrent();
}

/* ===========================
   TTS target
=========================== */
function listenTarget(){
  const item=store.session[store.idx];
  if(!item) return;
  if(!('speechSynthesis' in window)){
    setStatus('This browser does not support TTS.','warn'); return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(item.en);
  u.lang='en-US'; u.rate=0.95; u.pitch=1.0;
  window.speechSynthesis.speak(u);
}

/* ===========================
   Live WebSpeech ASR + Whisper refine
=========================== */
let liveRec=null, liveTranscript='';

function startLiveWebSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  liveTranscript='';
  if(!SR) return;
  liveRec=new SR();
  liveRec.lang='en-US';
  liveRec.interimResults=true;
  liveRec.maxAlternatives=1;
  liveRec.onresult=(e)=>{
    let txt='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      txt+=e.results[i][0].transcript+' ';
    }
    liveTranscript=txt.trim();
  };
  try{ liveRec.start(); }catch(e){}
}
function stopLiveWebSpeech(){
  try{ liveRec&&liveRec.stop(); }catch(e){}
  liveRec=null;
}

/* Whisper loading */
const { pipeline } = window.transformers;
let asr=null;
async function initWhisper(){
  const prefer=['Xenova/whisper-base.en','Xenova/whisper-small.en','Xenova/whisper-tiny.en'];
  for(const m of prefer){
    try{
      asr=await pipeline('automatic-speech-recognition',m,{dtype:'q4',device:'webgpu'});
      store.whisperReady=true; return;
    }catch(e){
      try{
        asr=await pipeline('automatic-speech-recognition',m,{dtype:'q4'});
        store.whisperReady=true; return;
      }catch(e2){}
    }
  }
  store.whisperReady=false;
}
initWhisper();
function withTimeout(p,ms){
  return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
}
async function transcribeWithWhisper(audioData,ms=20000){
  if(!asr) return '';
  const r=await withTimeout(
    asr(audioData,{language:'en',task:'transcribe',beam_size:3,temperature:0.0}),
    ms
  );
  return r?.text?.trim()||'';
}

/* ===========================
   Recording + meter
=========================== */
let mediaRecorder,audioChunks=[],audioCtx,analyser,meterRAF;
let startedAt=0,timerInt=null,streamRef=null;

async function ensureMic(){
  if(streamRef) return streamRef;
  streamRef=await navigator.mediaDevices.getUserMedia({audio:true});
  return streamRef;
}
function startMeter(stream){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=1024;
  src.connect(analyser);

  const data=new Uint8Array(analyser.fftSize);
  const tick=()=>{
    analyser.getByteTimeDomainData(data);
    let sum=0;
    for(let i=0;i<data.length;i++){
      const v=(data[i]-128)/128; sum+=v*v;
    }
    const rms=Math.sqrt(sum/data.length);
    ui.meterBar.style.width=clamp(rms*180,0,100)+'%';
    meterRAF=requestAnimationFrame(tick);
  };
  tick();
}
function stopMeter(){
  cancelAnimationFrame(meterRAF);
  ui.meterBar.style.width='0%';
}
function startTimer(){
  startedAt=Date.now();
  ui.timerPill.textContent='00:00';
  timerInt=setInterval(()=>{
    const s=Math.floor((Date.now()-startedAt)/1000);
    const mm=String(Math.floor(s/60)).padStart(2,'0');
    const ss=String(s%60).padStart(2,'0');
    ui.timerPill.textContent=`${mm}:${ss}`;
  },250);
}
function stopTimer(){ clearInterval(timerInt); timerInt=null; }

async function recordOnce(){
  clearResult();
  const item=store.session[store.idx];
  if(!item) return;

  setStatus('Recording… speak now.','ok');
  const stream=await ensureMic();
  startMeter(stream);

  audioChunks=[];
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
  mediaRecorder.onstop=handleAudioStop;

  startLiveWebSpeech();

  mediaRecorder.start();
  startTimer();
  ui.recordBtn.disabled=true;
  ui.stopBtn.disabled=false;
  ui.playMineBtn.disabled=true;
}
function stopRecording(){
  stopLiveWebSpeech();
  if(mediaRecorder&&mediaRecorder.state==='recording') mediaRecorder.stop();
}

function trimSilence(audioBuffer,thr=0.006,padSec=0.12){
  const ch=audioBuffer.getChannelData(0), sr=audioBuffer.sampleRate;
  let s=0,e=ch.length-1;
  while(s<ch.length&&Math.abs(ch[s])<thr) s++;
  while(e>0&&Math.abs(ch[e])<thr) e--;
  const pad=Math.floor(sr*padSec);
  s=Math.max(0,s-pad); e=Math.min(ch.length-1,e+pad);
  const len=e-s+1;
  const out=new AudioBuffer({length:len,numberOfChannels:1,sampleRate:sr});
  out.copyToChannel(ch.slice(s,e+1),0);
  return out;
}

async function handleAudioStop(){
  stopMeter(); stopTimer();
  ui.stopBtn.disabled=true;
  ui.recordBtn.disabled=false;

  const blob=new Blob(audioChunks,{type:'audio/webm'});
  store.lastRecordingBlob=blob;
  ui.playMineBtn.disabled=false;

  const arrayBuffer=await blob.arrayBuffer();
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const audioBuffer=await ctx.decodeAudioData(arrayBuffer);

  let trimmed=trimSilence(audioBuffer,0.006,0.12);
  if(trimmed.length/trimmed.sampleRate<0.35) trimmed=audioBuffer;
  const audioData=trimmed.getChannelData(0);

  setStatus('Transcribing…');

  let hypText=liveTranscript||'';
  if(store.whisperReady&&store.preferWhisper){
    const w=await transcribeWithWhisper(audioData,20000);
    if(w) hypText=w;
  }

  if(!hypText){
    setStatus('No speech detected. Try again.','warn');
    return;
  }

  const refText=store.session[store.idx].en.trim();
  const analysis=analyze(refText,hypText);

  store.results.set(store.idx, analysis);

  ui.resultPanel.hidden=false;
  ui.hypLine.textContent=hypText;
  ui.accLine.textContent=analysis.acc+'%';
  ui.diffLine.innerHTML=formatDiff(analysis.diffs);

  setStatus('Done. You can listen to your voice and go next.','ok');

  // auto next inside 10 session, but stop at end
  if(store.session.length===10){
    const doneCount=[...store.results.keys()].length;
    if(doneCount>=10){
      ui.sessionDone.hidden=false;
    }else{
      if(store.idx<9){ store.idx++; }
    }
  }else{
    if(store.idx<store.session.length-1) store.idx++;
  }
  renderCurrent();
}

/* Playback student's voice */
function playMine(){
  if(!store.lastRecordingBlob) return;
  const url=URL.createObjectURL(store.lastRecordingBlob);
  const audio=new Audio(url);
  audio.onended=()=>URL.revokeObjectURL(url);
  audio.play();
}

/* ===========================
   Scoring (match sentences)
=========================== */
function normalizeText(s){
  return s.toLowerCase()
    .replace(/[“”"']/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function lev(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}
function diffWords(ref,hyp){
  const a=ref,b=hyp,m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  const bt=Array.from({length:m+1},()=>Array(n+1).fill(null));
  for(let i=0;i<=m;i++){dp[i][0]=i;bt[i][0]='del'}
  for(let j=0;j<=n;j++){dp[0][j]=j;bt[0][j]='ins'}
  bt[0][0]=null;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      const opts=[
        [dp[i-1][j]+1,'del'],
        [dp[i][j-1]+1,'ins'],
        [dp[i-1][j-1]+cost,cost?'sub':'ok']
      ].sort((x,y)=>x[0]-y[0])[0];
      dp[i][j]=opts[0]; bt[i][j]=opts[1];
    }
  }
  let i=m,j=n,out=[];
  while(i>0||j>0){
    const op=bt[i][j];
    if(op==='ok'||op==='sub'){out.push({op,ref:a[i-1],hyp:b[j-1]});i--;j--;}
    else if(op==='del'){out.push({op,ref:a[i-1],hyp:''});i--;}
    else {out.push({op:'ins',ref:'',hyp:b[j-1]});j--;}
  }
  return out.reverse();
}
function analyze(refText,hypText){
  const refN=normalizeText(refText), hypN=normalizeText(hypText);
  const refTokens=refN.split(' ').filter(Boolean);
  const hypTokens=hypN.split(' ').filter(Boolean);
  const edits=lev(refTokens,hypTokens);
  const wer=refTokens.length?edits/refTokens.length:1;
  const acc=clamp(Math.round((1-wer)*100),0,100);
  const diffs=diffWords(refTokens,hypTokens);
  return { hyp:hypText, acc, diffs };
}
function formatDiff(diffs){
  return diffs.map(d=>{
    if(d.op==='ok') return `<span class="ok">${escapeHtml(d.hyp)}</span>`;
    if(d.op==='sub') return `<span class="sub">${escapeHtml(d.hyp)}</span>`;
    if(d.op==='del') return `<span class="del">${escapeHtml(d.ref)}</span>`;
    if(d.op==='ins') return `<span class="ins">${escapeHtml(d.hyp)}</span>`;
  }).join(' ');
}

/* ===========================
   Export / Print
=========================== */
function openExport(){
  if(!store.session.length){
    setStatus('No session to export.','warn'); return;
  }
  const rows=store.session.map((it,i)=>{
    const r=store.results.get(i);
    return `
      <tr>
        <td>${i+1}</td>
        <td>${escapeHtml(it.en)}</td>
        <td>${escapeHtml(r?.hyp||'')}</td>
        <td>${r? (r.acc+'%') : ''}</td>
      </tr>
    `;
  }).join('');
  ui.exportTableBody.innerHTML=rows;
  ui.exportBackdrop.style.display='grid';
}
function closeExport(){ ui.exportBackdrop.style.display='none'; }

function downloadJson(){
  const student={
    class: ui.classInput.value.trim(),
    seat: ui.seatInput.value.trim(),
    name: ui.nameInput.value.trim(),
  };
  const payload={
    student,
    source: store.source,
    level: store.source==='bank'?store.level:null,
    unit: store.source==='bank'?store.unit:null,
    session: store.session,
    results: [...store.results.entries()].map(([i,r])=>({index:i+1,...r}))
  };

  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`speaking_report_${student.class||'class'}_${student.seat||'seat'}_${student.name||'name'}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function printReport(){
  if(!ui.classInput.value.trim() || !ui.seatInput.value.trim() || !ui.nameInput.value.trim()){
    alert('請先填寫班級、座號、姓名再列印。');
    return;
  }
  window.print();
}

/* ===========================
   Bind actions
=========================== */
$('#app').addEventListener('click',(e)=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const a=btn.dataset.action;
  if(a==='prev') nav(-1);
  if(a==='next') nav(1);
  if(a==='listenTarget') listenTarget();
  if(a==='record') recordOnce();
  if(a==='stop') stopRecording();
  if(a==='playMine') playMine();
  if(a==='applyManual') applyManual();
  if(a==='load10') load10Random();
  if(a==='applyBankUnit') applyBankUnit();
  if(a==='export') openExport();
  if(a==='closeExport') closeExport();
  if(a==='downloadJson') downloadJson();
  if(a==='print') printReport();
});

/* source buttons */
$('#app').addEventListener('click',(e)=>{
  const sbtn=e.target.closest('[data-src]');
  if(!sbtn) return;
  setSource(sbtn.dataset.src);
});

/* init */
setSource('manual');
renderCurrent();
setStatus('請先載入 10 題再開始練習。','ok');
</script>
